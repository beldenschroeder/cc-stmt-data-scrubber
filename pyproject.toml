[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-stmt-data-scrubber"
version = "0.1.0"
description = "A tool for scrubbing credit card statement data."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Belden Schroeder", email = "beldenschroeder@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Repository = "https://github.com/beldenschroeder/cc-stmt-data-scrubber"

[project.scripts]
cc-scrubber = "cc_stmt_data_scrubber.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_stmt_data_scrubber"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
