[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cc-stmt-data-scrubber"
version = "0.1.0"
description = "A tool for scrubbing credit card statement data."
readme = "README.md"
requires-python = ">=3.8.1"
authors = [
    {name = "Belden Schroeder", email = "beldenschroeder@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.13.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Repository = "https://github.com/beldenschroeder/cc_stmt_data_scrubber"

[project.scripts]
cc-scrubber = "cc_stmt_data_scrubber.main:main"

[tool.poetry]
packages = [{include = "cc_stmt_data_scrubber", from = "src"}]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
